<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro - Hero Games</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/estilos.css" />
  </head>

  <body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="../index.html">
          <img
            src="../img/Herogameslogo.png"
            alt="Bootstrap"
            width="60"
            height="48"
          />
          HeroGames
        </a>
      </div>
    </nav>

    <main
      class="container d-flex justify-content-center align-items-center flex-grow-1 my-4"
    >
      <div
        class="card p-4 shadow-lg border-secondary"
        style="max-width: 450px; width: 100%"
      >
        <div class="card-body">
          <h2 class="card-title text-center mb-4 text-info fw-bold">
            Crear Cuenta
          </h2>

          <form>
            <div class="mb-3">
              <label for="inputName" class="form-label">Nombre completo</label>
              <input
                type="text"
                class="form-control"
                id="inputName"
                placeholder="Tu nombre y apellido"
                required
              />
            </div>

            <div class="mb-3">
              <label for="inputEmail" class="form-label"
                >Correo electrónico</label
              >
              <input
                type="email"
                class="form-control"
                id="inputEmail"
                placeholder="nombre@ejemplo.com"
                required
              />
            </div>

            <div class="mb-3">
              <label for="inputPassword" class="form-label">Contraseña</label>
              <input
                type="password"
                class="form-control"
                id="inputPassword"
                placeholder="••••••••"
                required
              />
            </div>

            <div class="mb-3">
              <label for="inputPasswordConfirm" class="form-label"
                >Confirmar contraseña</label
              >
              <input
                type="password"
                class="form-control"
                id="inputPasswordConfirm"
                placeholder="••••••••"
                required
              />
            </div>

            <div class="mb-3 form-check">
              <input
                type="checkbox"
                class="form-check-input"
                id="checkTerms"
                required
              />
              <label class="form-check-label text-secondary" for="checkTerms">
                Acepto los
                <a href="#" class="text-decoration-none text-info"
                  >términos y condiciones</a
                >
              </label>
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold">
              Registrarse
            </button>

            <div class="mt-3 text-center">
              <a href="login.html" class="text-decoration-none text-info"
                >¿Ya tienes una cuenta? Inicia sesión aquí</a
              >
            </div>
          </form>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <footer class="bg-body-tertiary text-secondary py-3 mt-auto text-center">
      <small>&copy; 2026 Hero Games. Todos los derechos reservados.</small>
    </footer>
  </body>
</html>
