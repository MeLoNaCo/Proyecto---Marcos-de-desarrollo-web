<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finalizar compra - Hero Games</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/estilos.css" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <nav class="navbar bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="../index.html">Hero Games</a
        ><a href="carrito.html" class="btn btn-outline-info"
          >Volver al carrito</a
        >
      </div>
    </nav>
    <main class="container my-5 flex-grow-1">
      <h1 class="text-info mb-4">Confirmar compra</h1>
      <div class="row g-4">
        <section class="col-lg-7">
          <form
            id="formularioCheckout"
            class="card bg-dark border-secondary p-4"
          >
            <h2 class="h4">Datos del comprador</h2>
            <label for="nombreCliente" class="form-label mt-3"
              >Nombre completo</label
            ><input id="nombreCliente" class="form-control" required /><label
              for="correoCliente"
              class="form-label mt-3"
              >Correo electrónico</label
            ><input
              id="correoCliente"
              type="email"
              class="form-control"
              required
            /><label for="direccionCliente" class="form-label mt-3"
              >Dirección de entrega</label
            ><input
              id="direccionCliente"
              class="form-control"
              required
            /><button type="submit" class="btn btn-success mt-4">
              Confirmar y pagar
            </button>
          </form>
        </section>
        <aside class="col-lg-5">
          <div class="card bg-dark border-secondary p-4">
            <h2 class="h4">Resumen del pedido</h2>
            <div id="resumenCheckout" class="my-3"></div>
            <div class="d-flex justify-content-between border-top pt-3">
              <strong>Total</strong
              ><strong id="totalCheckout" class="text-success">S/ 0.00</strong>
            </div>
          </div>
        </aside>
      </div>
    </main>
    <footer class="bg-body-tertiary text-secondary py-4 mt-auto text-center">
      <small>&copy; 2026 Hero Games. Todos los derechos reservados.</small>
    </footer>
    <script src="../js/funciones.js"></script>
  </body>
</html>
