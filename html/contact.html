<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Hero Games</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body class="d-flex flex-column min-vh-100">
    
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="../index.html">
                <img src="../img/Herogameslogo.png" alt="Bootstrap" width="60" height="48">
                HeroGames
            </a>
        </div>
    </nav>

    <main class="container d-flex justify-content-center align-items-center flex-grow-1 my-4">
        <div class="row w-100 justify-content-center">
            <div class="col-lg-8">
                <div class="card p-4 shadow-lg border-secondary">
                    <div class="card-body">
                        <h2 class="card-title text-center mb-2 text-info fw-bold">Contáctanos</h2>
                        <p class="text-center text-secondary mb-4">
                            ¿Tienes dudas sobre nuestros artículos electrónicos? Escríbenos y te responderemos a la
                            brevedad.
                        </p>

                        <div class="row">
                            <div class="col-md-5 mb-4 mb-md-0">
                                <h5 class="text-info mb-3">Información</h5>
                                <ul class="list-unstyled text-secondary">
                                    <li class="mb-3 d-flex align-items-start">
                                        <span class="me-2">📍</span>
                                        <span>Av. Los Héroes 123, Lima, Perú</span>
                                    </li>
                                    <li class="mb-3 d-flex align-items-start">
                                        <span class="me-2">📞</span>
                                        <span>+51 987 654 321</span>
                                    </li>
                                    <li class="mb-3 d-flex align-items-start">
                                        <span class="me-2">✉️</span>
                                        <span>contacto@herogames.pe</span>
                                    </li>
                                    <li class="mb-3 d-flex align-items-start">
                                        <span class="me-2">🕒</span>
                                        <span>Lun. a Sáb. de 9:00 a 20:00</span>
                                    </li>
                                </ul>
                            </div>

                            <div class="col-md-7">
                                <form>
                                    <div class="mb-3">
                                        <label for="inputName" class="form-label">Nombre completo</label>
                                        <input type="text" class="form-control" id="inputName"
                                            placeholder="Tu nombre y apellido" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="inputEmail" class="form-label">Correo electrónico</label>
                                        <input type="email" class="form-control" id="inputEmail"
                                            placeholder="nombre@ejemplo.com" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="inputSubject" class="form-label">Asunto</label>
                                        <select class="form-select" id="inputSubject" required>
                                            <option value="" selected disabled>Selecciona un motivo</option>
                                            <option value="consulta">Consulta sobre un producto</option>
                                            <option value="pedido">Estado de mi pedido</option>
                                            <option value="soporte">Soporte técnico</option>
                                            <option value="otro">Otro</option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label for="inputMessage" class="form-label">Mensaje</label>
                                        <textarea class="form-control" id="inputMessage" rows="4"
                                            placeholder="Escribe tu mensaje aquí..." required></textarea>
                                    </div>
                                    <button type="submit" class="btn btn-primary w-100 fw-bold">Enviar mensaje</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
