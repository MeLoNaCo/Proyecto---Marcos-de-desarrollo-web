<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Productos - Panel de administración</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../css/admin.css" />
  </head>
  <body class="bg-light">
    <div class="d-flex flex-column flex-md-row min-vh-100">
      <nav
        class="bg-dark-custom text-light p-3 d-flex flex-column sidebar-desktop"
      >
        <h4 class="text-accent fst-italic text-center mb-4">Hero Games</h4>
        <small class="text-secondary text-center mb-3"
          >Panel de administración</small
        >
        <ul class="nav nav-pills flex-column gap-1">
          <li>
            <a class="nav-link text-light" href="dashboard.html">Resumen</a>
          </li>
          <li>
            <a class="nav-link text-light" href="compras.html">Compras</a>
          </li>
          <li>
            <a class="nav-link text-light" href="clientes.html">Clientes</a>
          </li>
          <li>
            <a class="nav-link active text-white" href="productos.html"
              >Productos</a
            >
          </li>
          <li>
            <a class="nav-link text-light" href="reportes.html">Reportes</a>
          </li>
        </ul>
        <a href="../../index.html" class="btn btn-outline-danger w-100 mt-auto"
          >Cerrar sesión</a
        >
      </nav>
      <main class="flex-grow-1 p-3 p-md-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h1 class="h3">Gestión de productos</h1>
          <a href="../../index.html" class="btn btn-outline-secondary"
            >Ver tienda</a
          >
        </div>
        <div class="row g-4">
          <section class="col-lg-4">
            <form id="formularioProducto" class="card p-4 text-dark">
              <h2 class="h5">Nuevo producto</h2>
              <input type="hidden" id="productoId" /><label
                for="productoNombre"
                class="form-label mt-3"
                >Nombre</label
              ><input id="productoNombre" class="form-control" required /><label
                for="productoDescripcion"
                class="form-label mt-3"
                >Descripción</label
              ><textarea
                id="productoDescripcion"
                class="form-control"
                required
              ></textarea
              ><label for="productoPrecio" class="form-label mt-3">Precio</label
              ><input
                id="productoPrecio"
                type="number"
                min="0"
                step="0.01"
                class="form-control"
                required
              /><label for="productoCategoria" class="form-label mt-3"
                >Categoría</label
              ><select
                id="productoCategoria"
                class="form-select"
                required
              ></select
              ><label for="productoStock" class="form-label mt-3">Stock</label
              ><input
                id="productoStock"
                type="number"
                min="0"
                class="form-control"
                required
              />
              <div class="d-flex gap-2 mt-4">
                <button class="btn btn-primary" type="submit">Guardar</button
                ><button
                  class="btn btn-secondary"
                  type="button"
                  id="cancelarEdicion"
                >
                  Cancelar
                </button>
              </div>
            </form>
          </section>
          <section class="col-lg-8">
            <div class="table-responsive card">
              <table class="table table-dark table-striped align-middle mb-0">
                <thead>
                  <tr>
                    <th>Producto</th>
                    <th>Categoría</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Acciones</th>
                  </tr>
                </thead>
                <tbody id="tablaProductos"></tbody>
              </table>
            </div>
          </section>
        </div>
      </main>
    </div>
    <script src="../../js/funciones.js"></script>
  </body>
</html>
