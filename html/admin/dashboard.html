<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hero Games - Panel de administración</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="../../css/admin.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <div class="d-flex flex-column flex-md-row min-vh-100">
      <nav
        class="bg-dark-custom text-light p-3 d-flex flex-column sidebar-desktop"
      >
        <div class="text-center mb-4">
          <h4 class="text-accent fst-italic mb-0">Hero Games</h4>
          <small class="text-secondary">Panel de administración</small>
        </div>
        <ul class="nav nav-pills flex-column gap-1">
          <li class="nav-item">
            <a class="nav-link active text-white" href="dashboard.html"
              >Resumen</a
            >
          </li>
          <li class="nav-item">
            <a class="nav-link text-light" href="compras.html">Compras</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-light" href="clientes.html">Clientes</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-light" href="productos.html">Productos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-light" href="reportes.html">Reportes</a>
          </li>
        </ul>
        <a href="../../index.html" class="btn btn-outline-danger w-100 mt-auto"
          >Cerrar sesión</a
        >
      </nav>
      <main class="flex-grow-1 p-3 p-md-4">
        <h1 class="h3 mb-4">Resumen del panel</h1>
        <div class="row g-3 mb-4">
          <div class="col-6 col-lg-3">
            <div class="card shadow-sm p-3 h-100">
              <strong id="totalProductos">0</strong
              ><span class="text-secondary">Productos</span>
            </div>
          </div>
          <div class="col-6 col-lg-3">
            <div class="card shadow-sm p-3 h-100">
              <strong id="totalClientes">0</strong
              ><span class="text-secondary">Clientes</span>
            </div>
          </div>
          <div class="col-6 col-lg-3">
            <div class="card shadow-sm p-3 h-100">
              <strong id="totalPedidos">0</strong
              ><span class="text-secondary">Pedidos</span>
            </div>
          </div>
          <div class="col-6 col-lg-3">
            <div class="card shadow-sm p-3 h-100">
              <strong id="totalIngresos">S/ 0.00</strong
              ><span class="text-secondary">Ingresos</span>
            </div>
          </div>
        </div>
        <section class="card shadow-sm p-4">
          <h2 class="h5">Acciones rápidas</h2>
          <div class="d-flex flex-wrap gap-2">
            <a class="btn bg-accent text-white" href="productos.html"
              >Administrar productos</a
            >
            <a class="btn btn-outline-secondary" href="reportes.html"
              >Ver reportes</a
            >
          </div>
        </section>
        <footer class="text-secondary py-3 mt-5">
          <small>&copy; 2026 Hero Games. Todos los derechos reservados.</small>
        </footer>
      </main>
    </div>
    <script src="../../js/funciones.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const productos = obtenerProductos();
        const pedidos = leerDatos(clavePedidos, []);
        const usuarios = leerDatos(claveUsuarios, []).filter(
          (usuario) => usuario.rol === "cliente",
        );
        document.getElementById("totalProductos").textContent =
          productos.length;
        document.getElementById("totalClientes").textContent = usuarios.length;
        document.getElementById("totalPedidos").textContent = pedidos.length;
        document.getElementById("totalIngresos").textContent = formatoMoneda(
          pedidos.reduce(
            (total, pedido) => total + Number(pedido.total || 0),
            0,
          ),
        );
      });
    </script>
  </body>
</html>
