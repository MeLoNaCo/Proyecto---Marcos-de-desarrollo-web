<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/estilos.css">
</head>

<body class="d-flex flex-column min-vh-100">
    
    <nav class="navbar bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="../index.html">
                <img src="../img/Herogameslogo.png" alt="Bootstrap" width="60" height="48">
                HeroGames
            </a>
        </div>
    </nav>

    <main class="container d-flex justify-content-center align-items-center flex-grow-1 my-4">
        <div class="card p-4 shadow-lg border-secondary" style="max-width: 400px; width: 100%;">
            <div class="card-body">

                <h2 class="card-title text-center mb-4 text-info fw-bold">Iniciar Sesión</h2>

                <form>
                    <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" id="exampleInputEmail1"
                            placeholder="nombre@ejemplo.com" required>
                    </div>

                    <div class="mb-3">
                        <label for="exampleInputPassword1" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="exampleInputPassword1" placeholder="••••••••"
                            required>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="exampleCheck1">
                        <label class="form-check-label text-secondary" for="exampleCheck1">Recordarme</label>
                    </div>

                    <div class="mb-3 text-center">
                        <a href="#" class="text-decoration-none text-info">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 fw-bold">Ingresar</button>

                    <div class="mt-3 text-center">
                        <a href="registro.html" class="text-decoration-none text-info">¿No tienes una cuenta? Regístrate aquí</a>
                    </div>
                </form>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
