<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión - Hero Games</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/estilos.css" />
  </head>

  <body class="d-flex flex-column min-vh-100">
    <nav class="navbar bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="../index.html">
          <img
            src="../img/Herogameslogo.png"
            alt="Logo de Hero Games"
            width="60"
            height="48"
          />
          HeroGames
        </a>
      </div>
    </nav>

    <main
      class="container d-flex justify-content-center align-items-center flex-grow-1 my-4"
    >
      <div
        class="card p-4 shadow-lg border-secondary"
        style="max-width: 400px; width: 100%"
      >
        <div class="card-body">
          <h2 class="card-title text-center mb-4 text-info fw-bold">
            Iniciar Sesión
          </h2>

          <div class="mb-3">
            <p class="small text-secondary mb-2">Accesos demo</p>
            <div class="d-grid gap-2">
              <button
                type="button"
                class="btn btn-outline-info btn-sm"
                data-demo="admin"
              >
                Demo Admin (admin)
              </button>
              <button
                type="button"
                class="btn btn-outline-secondary btn-sm"
                data-demo="cliente"
              >
                Demo Cliente (cliente)
              </button>
            </div>
          </div>
          <div id="avisoAplicacion" class="d-none" role="alert"></div>
          <form id="formularioLogin">
            <div class="mb-3">
              <label for="correo" class="form-label">Correo electrónico</label>
              <input
                type="email"
                class="form-control"
                id="correo"
                placeholder="nombre@ejemplo.com"
                required
              />
            </div>

            <div class="mb-3">
              <label for="contrasena" class="form-label">Contraseña</label>
              <input
                type="password"
                class="form-control"
                id="contrasena"
                placeholder="••••••••"
                required
              />
            </div>

            <div class="mb-3 form-check">
              <input
                type="checkbox"
                class="form-check-input"
                id="exampleCheck1"
              />
              <label class="form-check-label text-secondary" for="exampleCheck1"
                >Recordarme</label
              >
            </div>

            <div class="mb-3 text-center">
              <a href="#" class="text-decoration-none text-info"
                >¿Olvidaste tu contraseña?</a
              >
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold">
              Ingresar
            </button>

            <div class="mt-3 text-center">
              <a href="registro.html" class="text-decoration-none text-info"
                >¿No tienes una cuenta? Regístrate aquí</a
              >
            </div>
          </form>
        </div>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="../js/funciones.js"></script>
    <footer class="bg-body-tertiary text-secondary py-3 mt-auto text-center">
      <small>&copy; 2026 Hero Games. Todos los derechos reservados.</small>
    </footer>
  </body>
</html>
